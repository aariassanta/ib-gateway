services:
  ib-gateway:
    image: ib-gateway-fixed:latest
    container_name: ib-gateway
    restart: no
    environment:
      - TRADING_MODE=${TRADING_MODE:-paper}
      - TWS_USERID=${IBKR_USERID}
      - TWS_PASSWORD=${IBKR_PASSWORD}
      - READ_ONLY_API=${READ_ONLY_API:-no}
      - TIME_ZONE=${TIME_ZONE:-Europe/Madrid}
      - AUTO_RESTART_TIME=${AUTO_RESTART_TIME:-11:45 PM}
      - RELOGIN_AFTER_TWOFA_TIMEOUT=${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      - TWOFA_EXIT_INTERVAL=${TWOFA_EXIT_INTERVAL:-60}
      - ACCEPT_MKT_DATA_DIALOG=yes
      - ACCEPT_NON_BROKERAGE_ACCOUNT_WARNING=yes
      - BYPASS_WARNING=yes
      - TWS_ACCEPT_INCOMING=accept
      - ALLOW_BLIND_TRADING=yes
    ports:
      - "4002:4004"
    volumes:
      - ib-gateway-data:/home/ibgateway:rw
    healthcheck:
      # Probe TWS's own API port (4002), NOT 4004.
      #
      # 4004 is the socat listener from run_socat.sh; it accepts a connection
      # even when TWS is dead, so the old check reported "healthy" while the
      # gateway was completely down — and that is how a dead gateway stayed
      # unnoticed through 510 failed logins. 4002 is the port TWS binds only
      # after a successful login.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4002' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    networks:
      - ib-trading-app_default

networks:
  ib-trading-app_default:
    external: true

volumes:
  ib-gateway-data:
